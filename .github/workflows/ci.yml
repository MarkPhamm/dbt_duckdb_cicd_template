# CI — continuous integration.
# A pull request opened -> download last night's CD artifact ->
# build only what changed, and read the rest from prod.
#
# This file must not write to production. That is cd.yml.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the locked dbt
        run: uv sync --frozen

      - name: Download the latest CD artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prod_dbt_artifacts database
          RUN_ID=$(gh run list \
            --workflow=cd.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful cd.yml run on main yet."
            echo "Merge to main once (or Run workflow) so CD can upload artifacts."
            exit 1
          fi
          gh run download "$RUN_ID" --name prod-dbt-artifacts --dir prod_dbt_artifacts
          cp prod_dbt_artifacts/database.duckdb database/database.duckdb

      - name: Slim CI
        run: >
          uv run dbt build --target ci
          --select state:modified+
          --defer --state prod_dbt_artifacts/

  # A second, independent check: what did this PR do to the SHAPE of the data?
  #
  # slim-ci above answers "are the numbers still right?". This answers
  # "did a table or column appear, vanish or get renamed?" — the thing a
  # reviewer reading a SQL diff is worst at spotting.
  #
  # It deliberately shares nothing with slim-ci: no prod artifact, no
  # database, no --defer. `dbt parse` writes target/manifest.json without
  # connecting to anything, and the whole schema is derived from that file.
  # So this job stays green on a brand-new repo that has never run CD.
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the action posts/updates one comment
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the locked dbt
        run: uv sync --frozen

      # Cheapest possible manifest: parses the project, touches no warehouse.
      - name: Parse the project
        run: uv run dbt parse

      - uses: MarkPhamm/quickdbd-cli@v0.2.3
        with:
          dbt-manifest: target/manifest.json
          path: erd/
          # Fail if erd/ is out of date instead of silently regenerating, so
          # the committed files are always a truthful "before" to diff against.
          dbt-check: "true"
          output: target/erd.html # target/ is gitignored; this is a build output
          qdbd-version: "0.2.3" # pinned for the same reason dbt is
