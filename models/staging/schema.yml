version: 2

models:
  - name: stg_customers
    description: "One row per customer, renamed from raw."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests: [unique, not_null]

  - name: stg_orders
    description: "One row per order, renamed from raw."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          # If someone adds a new status upstream, this test goes red in CI
          # BEFORE the change reaches production. That is the whole point of
          # running tests in a pull request.
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'placed']

  - name: stg_payments
    description: "One row per payment. Amounts converted from cents to dollars."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
